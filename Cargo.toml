[package]
name = "modu"
version.workspace = true
autoexamples = false
categories = ["game-engines"]
edition.workspace = true
keywords = ["gamedev", "game-engine"]
license.workspace = true
description = "A modular game engine"

[features]
app = ["dep:modu_app", "gpu", "window"]
gpu = ["dep:modu_gpu"]
math = ["dep:modu_math"]
window = ["dep:modu_window"]

[dependencies]
modu_app = { workspace = true, optional = true }
modu_gpu = { workspace = true, optional = true }
modu_math = { workspace = true, optional = true }
modu_window = { workspace = true, optional = true }

[workspace]
members = [
    ".",
    "crates/modu_app",
    "crates/modu_gpu",
    "crates/modu_math",
    "crates/modu_window",
    "examples/empty_app",
    "examples/pong",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
modu = { path = "." }
modu_app = { path = "crates/modu_app" }
modu_gpu = { path = "crates/modu_gpu" }
modu_math = { path = "crates/modu_math" }
modu_window = { path = "crates/modu_window" }

ggmath = "0.18.2"
pollster = "1.0.1"
wgpu = "30.0.1"
winit = "0.30.13"
